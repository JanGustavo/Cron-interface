<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" />
      <stop offset="50%" stop-color="#3a86f0" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circular glow for depth -->
  <circle cx="256" cy="256" r="240" fill="#04060c" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#brandGrad)" stroke-width="16" filter="url(#neon)" />
  
  <!-- Dynamic timing ticks / dash ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#252b48" stroke-width="8" stroke-dasharray="12 18" />
  
  <!-- Central Stylized Lightning/Chronograph flow icon -->
  <g filter="url(#neon)">
    <!-- Recurrence Loop (Clock arrow) -->
    <path d="M 256,90 A 166,166 0 1,1 90,256" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" />
    <path d="M 70,256 L 90,276 L 120,246" fill="none" stroke="url(#brandGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Trigger Bolt -->
    <path d="M 290,130 L 190,260 L 255,260 L 220,380 L 330,230 L 265,230 Z" fill="url(#glowGrad)" />
  </g>
</svg>